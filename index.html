<script>
let DATA={"courses":[{"id":"a1","level":"A1","title":"A1 Temelleri","description":"Selamlaşma, tanışma, artikel, sein/haben ve Präsens.","position":1},{"id":"a2","level":"A2","title":"A2 Gelişim","description":"Perfekt, Dativ ve Nebensätze.","position":2}],"lessons":[{"id":"a1-begruessung","course_id":"a1","level":"A1","title":"Hallo und Begrüßung","intro_tr":"Almanca'da selamlaşma günün saatine ve resmiyet derecesine göre değişir.","points":["Hallo ve Hi gayriresmîdir; Guten Tag resmî ortamlarda kullanılır.","Sabah Guten Morgen, akşam Guten Abend denir.","Tschüs gayriresmî, Auf Wiedersehen resmî vedalaşmadır.","Wie geht's? 'Nasılsın?' demektir; kısa cevap: Danke, gut."],"examples":[{"de":"Guten Morgen, Frau Müller!","tr":"Günaydın Bayan Müller!"},{"de":"Wie geht es Ihnen? – Danke, gut.","tr":"Nasılsınız? – Teşekkürler, iyi."},{"de":"Tschüs, bis morgen!","tr":"Hoşça kal, yarın görüşürüz!"}],"position":1},{"id":"a1-vorstellen","course_id":"a1","level":"A1","title":"Sich vorstellen","intro_tr":"Kendini tanıtırken sabit kalıplar kullanılır.","points":["Ich heiße … veya Mein Name ist … ile isim söylenir.","Ich komme aus … ile ülke/şehir belirtilir.","Ich wohne in … yaşadığın yeri anlatır.","Ich bin … Jahre alt yaşı söyler."],"examples":[{"de":"Ich heiße Ali und ich komme aus der Türkei.","tr":"Adım Ali ve Türkiye'denim."},{"de":"Ich wohne in Istanbul.","tr":"İstanbul'da oturuyorum."},{"de":"Ich bin 25 Jahre alt.","tr":"25 yaşındayım."}],"position":2},{"id":"a1-artikel","course_id":"a1","level":"A1","title":"Artikel: der, die, das","intro_tr":"Her Almanca ismin bir cinsiyeti vardır ve artikel isimle birlikte öğrenilmelidir.","points":["der eril, die dişil, das nötr isimlerle kullanılır.","Çoğulda artikel her zaman die olur.","Belirsiz artikel: ein (der/das), eine (die).","Cinsiyet çoğu zaman mantıkla tahmin edilemez; kelimeyi artikeliyle ezberle."],"examples":[{"de":"der Tisch – die Lampe – das Buch","tr":"masa – lamba – kitap"},{"de":"Die Kinder spielen im Garten.","tr":"Çocuklar bahçede oynuyor."},{"de":"Das ist eine Lampe.","tr":"Bu bir lamba."}],"position":3},{"id":"a1-sein-haben","course_id":"a1","level":"A1","title":"Sein und haben","intro_tr":"İki en önemli yardımcı fiil: sein (olmak) ve haben (sahip olmak).","points":["sein: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie sind.","haben: ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie haben.","sein durum/meslek bildirir, haben sahip olmayı anlatır.","Olumsuzluk: sein ile nicht, haben + isim ile kein kullanılır."],"examples":[{"de":"Ich bin Student.","tr":"Ben öğrenciyim."},{"de":"Er hat einen Bruder.","tr":"Onun bir erkek kardeşi var."},{"de":"Wir sind müde.","tr":"Biz yorgunuz."}],"position":4},{"id":"a1-praesens","course_id":"a1","level":"A1","title":"Präsens: Regelmäßige Verben","intro_tr":"Düzenli fiiller kök + kişi eki ile çekimlenir.","points":["Ekler: -e, -st, -t, -en, -t, -en (ich, du, er, wir, ihr, sie).","wohnen → ich wohne, du wohnst, er wohnt.","Fiil, düz cümlede ikinci sırada durur.","Evet/hayır sorusunda fiil en başa gelir: Wohnst du hier?"],"examples":[{"de":"Ich lerne jeden Tag Deutsch.","tr":"Her gün Almanca öğreniyorum."},{"de":"Er wohnt in Berlin.","tr":"O Berlin'de oturuyor."},{"de":"Trinkst du Kaffee?","tr":"Kahve içiyor musun?"}],"position":5},{"id":"a1-zahlen-uhrzeit","course_id":"a1","level":"A1","title":"Zahlen und Uhrzeit","intro_tr":"Sayıları ve saati söylemek günlük hayatın temelidir.","points":["1 eins, 2 zwei, 3 drei, 4 vier, 5 fünf, 6 sechs, 7 sieben, 8 acht, 9 neun, 10 zehn.","Saat sorusu: Wie spät ist es? veya Wie viel Uhr ist es?","Es ist drei Uhr. = Saat üç.","halb vier = 3:30 (Almanca'da 'dörde yarım kala' denir)."],"examples":[{"de":"Es ist neun Uhr.","tr":"Saat dokuz."},{"de":"Es ist halb vier.","tr":"Saat üç buçuk."},{"de":"Ich habe zwei Brüder.","tr":"İki erkek kardeşim var."}],"position":6},{"id":"a2-perfekt","course_id":"a2","level":"A2","title":"Perfekt","intro_tr":"Geçmişi konuşma dilinde en sık Perfekt ile anlatırız.","points":["Perfekt = haben/sein (Präsens) + Partizip II.","Çoğu fiil haben ile; hareket ve durum değişikliği (gehen, fahren, bleiben) sein ile kurulur.","Düzenli fiil: ge-…-t (machen → gemacht).","Partizip II cümlenin sonuna gider."],"examples":[{"de":"Ich habe Deutsch gelernt.","tr":"Almanca öğrendim."},{"de":"Er ist nach Berlin gefahren.","tr":"O Berlin'e gitti (araçla)."},{"de":"Wir haben Pizza gegessen.","tr":"Pizza yedik."}],"position":7},{"id":"a2-dativ","course_id":"a2","level":"A2","title":"Dativ","intro_tr":"Dativ 'kime/neye' sorusunun cevabıdır ve bazı edatlarla zorunlu kullanılır.","points":["Dativ artikelleri: dem (der/das), der (die), den + -n (çoğul).","mit, bei, nach, von, zu, aus, seit her zaman Dativ ister.","helfen, danken, gehören gibi fiiller Dativ ile kullanılır.","zu + dem = zum, zu + der = zur."],"examples":[{"de":"Ich helfe dem Kind.","tr":"Çocuğa yardım ediyorum."},{"de":"Sie fährt mit dem Bus.","tr":"O otobüsle gidiyor."},{"de":"Wir gehen zur Ärztin.","tr":"Doktora (kadın) gidiyoruz."}],"position":8},{"id":"a2-weil","course_id":"a2","level":"A2","title":"Nebensätze mit weil und dass","intro_tr":"weil ve dass ile yan cümle kurulduğunda fiil cümlenin sonuna gider.","points":["weil = çünkü; fiil yan cümlenin sonuna gider.","dass = ki/-diğini; fiil yine sonda durur.","Ana cümle ile yan cümle virgülle ayrılır.","Ich bleibe zu Hause, weil ich krank bin."],"examples":[{"de":"Ich lerne Deutsch, weil ich in Deutschland arbeiten will.","tr":"Almanya'da çalışmak istediğim için Almanca öğreniyorum."},{"de":"Er sagt, dass er müde ist.","tr":"Yorgun olduğunu söylüyor."},{"de":"Sie lacht, weil der Film lustig ist.","tr":"Film komik olduğu için gülüyor."}],"position":9}],"vocabulary":[{"de":"Mutter","article":"die","plural":"Mütter","tr":"anne","example_de":"Meine Mutter kocht gern.","example_tr":"Annem yemek yapmayı sever.","level":"A1","category":"Familie"},{"de":"Vater","article":"der","plural":"Väter","tr":"baba","example_de":"Mein Vater arbeit çin zur kullanılır."}],"position":3},{"id":"g-perfekt","level":"A2","title":"Perfekt","explanation_tr":"Perfekt = haben/sein + Partizip II. Hareket ve durum değişikliği bildiren fiiller sein alır.","comparisons":[{"wrong":"Ich habe nach Berlin gefahren.","right":"Ich bin nach Berlin gefahren.","why":"fahren hareket fiili olduğu için sein alır."}],"position":4},{"id":"g-dativ","level":"A2","title":"Dativ","explanation_tr":"Dativ kime/neye sorusunu cevaplar. mit, bei, nach, von, zu, aus, seit edatlarından sonra ve helfen, danken, gehören fiilleriyle kullanılır.","comparisons":[{"wrong":"Ich helfe das Kind.","right":"Ich helfe dem Kind.","why":"helfen Dativ ister."}],"position":5},{"id":"g-nebensatz","level":"A2","title":"Nebensätze","explanation_tr":"weil, dass, wenn gibi bağlaçlardan sonra çekimli fiil cümlenin sonuna gider.","comparisons":[{"wrong":"Ich bleibe, weil ich bin krank.","right":"Ich bleibe, weil ich krank bin.","why":"weil cümlesinde fiil sondadır."}],"position":6},{"id":"offline-akkusativ","level":"A1","title":"Akkusativ: nesne hâli","explanation_tr":"Belirli bir doğrudan nesne Akkusativ olur. Eril artikel der → den, belirsiz ein → einen biçimine dönüşür. Dişil ve nötr artikeller değişmez.","comparisons":[{"de":"Ich sehe den Mann.","tr":"Adamı görüyorum."},{"de":"Sie kauft eine Tasche.","tr":"Bir çanta alıyor."}],"position":20},{"id":"offline-modal","level":"A1","title":"Modal fiiller: können, müssen, wollen","explanation_tr":"Modal fiil çekimlenir, asıl fiil mastar hâlinde cümlenin sonuna gider. können yetenek, müssen zorunluluk, wollen istek bildirir.","comparisons":[{"de":"Ich kann gut schwimmen.","tr":"İyi yüzebilirim."},{"de":"Wir müssen heute lernen.","tr":"Bugün ders çalışmalıyız."}],"position":21},{"id":"offline-perfekt","level":"A2","title":"Perfekt: geçmiş zaman","explanation_tr":"Günlük konuşmada geçmişi anlatırken çoğunlukla Perfekt kullanılır. haben/sein çekimi ikinci sırada, Partizip II cümlenin sonunda yer alır.","comparisons":[{"de":"Ich habe gestern gearbeitet.","tr":"Dün çalıştım."},{"de":"Er ist nach Hause gegangen.","tr":"Eve gitti."}],"position":22},{"id":"offline-dativ","level":"A2","title":"Dativ: dolaylı nesne","explanation_tr":"Dativ kişi veya nesneye yönelme bildirir. Dativ alan edatlar arasında mit, bei, von, zu ve aus bulunur. Eril/nötr dem, dişil der olur.","comparisons":[{"de":"Ich fahre mit dem Bus.","tr":"Otobüsle gidiyorum."},{"de":"Sie hilft ihrer Mutter.","tr":"Annesine yardım ediyor."}],"position":23},{"id":"offline-nebensatz","level":"A2","title":"weil ve dass ile yan cümle","explanation_tr":"weil (çünkü) ve dass (…diğini) ile kurulan yan cümlede çekimli fiil sona gider.","comparisons":[{"de":"Ich bleibe zu Hause, weil ich krank bin.","tr":"Hastayım, bu yüzden evde kalıyorum."},{"de":"Ich weiß, dass er heute kommt.","tr":"Onun bugün geleceğini biliyorum."}],"position":24},{"id":"offline-trennbar","level":"A1","title":"Ayrılabilen fiiller","explanation_tr":"anrufen, einkaufen ve aufstehen gibi ayrılabilen fiillerde önek ana cümlede sona gider. Mastar biçiminde fiil birleşik kalır.","comparisons":[{"de":"Ich stehe um sieben Uhr auf.","tr":"Saat yedide kalkıyorum."},{"de":"Er ruft seine Mutter an.","tr":"Annesini arıyor."}],"position":25},{"id":"offline-komparativ","level":"A2","title":"Karşılaştırma: Komparativ","explanation_tr":"Karşılaştırmada sıfata çoğunlukla -er eklenir ve als kullanılır. Eşitlik karşılaştırması so … wie kalıbıyla yapılır.","comparisons":[{"de":"Berlin ist größer als Bonn.","tr":"Berlin Bonn'dan daha büyük."},{"de":"Er ist so alt wie ich.","tr":"O benim kadar yaşlı."}],"position":26}],"exercises":[{"id":"a1-begruessung-q1","skill":"grammatik","level":"A1","prompt":"Du triffst deinen Lehrer um 9 Uhr morgens. Was sagst du?","options":["Guten Morgen","Gute Nacht","Tschüs","Guten Abend"],"answer":"Guten Morgen","explanation":"Sabah saatlerinde Guten Morgen denir.","lesson_id":"a1-begruessung"},{"id":"a1-begruessung-q2","skill":"grammatik","level":"A1","prompt":" function addCurriculum() {
  for (const [level,[label,topics]] of Object.entries(CLASSROOM)) {
    const course = level.toLowerCase();
    if (!DATA.courses.some(item => item.id === course)) DATA.courses.push({id:course,level,title:label,position:CEFR.indexOf(level)+1});
    const next = DATA.lessons.filter(item => item.level === level).length;
    topics.forEach(([title,rule,sequence,tr,...words],index) => {
      const id = 'local-' + course + '-' + (index + 1);
      const tokens = sequence.split('|').map(token=>token.trim());
      const de = tokens.join(' ');
      const example = {de,tr};
      DATA.lessons.push({id,course_id:course,level,title,intro_tr:rule,points:[],examples:[example],position:next+index+1});
      DATA.grammar.push({id:id+'-grammar',level,title,explanation_tr:rule,comparisons:[example]});
      DATA.exercises.push(
        {id:id+'-order',lesson_id:id,level,skill:'order',prompt:'Bağlamdaki Almanca cümleyi oluştur.',passage:tr,tokens,answer:de,explanation:rule},
        {id:id+'-translation',lesson_id:id,level,skill:'translation',prompt:'Almanca cümlenin doğru Türkçe karşılığını seç.',passage:de,answer:tr,
          options:topics.map(topic=>topic[3]).concat(...Object.values(CLASSROOM).filter((_,i)=>i!==CEFR.indexOf(level)).slice(0,2).map(entry=>[entry[1][index][3]])),explanation:rule},
        {id:id+'-reverse',lesson_id:id,level,skill:'translation',prompt:'Türkçe cümlenin doğru Almanca karşılığını seç.',passage:tr,answer:de,
          options:[de,de.replace(tokens.at(-1), '').trim(), ...topics.filter((_,i)=>i!==index).map(topic=>topic[2].split('|').map(t=>t.trim()).join(' '))],explanation:rule}
      );
      for (const word of words) {
        const [article,noun,meaning] = word.split('|');
        if (!DATA.vocabulary.some(item=>item.de===noun && item.level===level)) DATA.vocabulary.push({de:noun,article,tr:meaning,level,category:label});
      }
    });
  }
  for (const [level,checks] of Object.entries(GRAMMAR_CHECKS)) {
    checks.forEach(([passage,answer,...rest],index)=>{
      const topic=rest.pop(), lesson='local-'+level.toLowerCase()+'-'+(topic+1);
      DATA.exercises.push({id:lesson+'-check',lesson_id:lesson,level,skill:'grammatik',prompt:'Cümleyi tamamlayan biçimi seç.',passage,answer,options:[answer,...rest],explanation:CLASSROOM[level][1][topic][1]});
    });
  }
  for (const [index,word] of DATA.vocabulary.entries()) {
    if (!['der','die','das'].includes(word.article)) continue;
    DATA.exercises.push({id:'local-article-'+index,level:word.level,skill:'article',prompt:'Boşluğa uygun belirli artikeli seç.',passage:'___ '+word.de+' · '+word.tr,options:['der','die','das'],answer:word.article,explanation:word.article+' '+word.de});
  }
}

  const baseTeacherPage = teacherPage;
  teacherPage = function () {
    document.body.classList.remove('welcome-mode');
    baseTeacherPage();
    if (dailyPack?.date === localDate()) document.querySelector('#ai-result').innerHTML = renderDaily(dailyPack.content);
    const today=localDate(), pending=!placement?'diagnostic':dailyPack?.date!==today?'daily':null;
    if(pending && autoRequested!==`${pending}:${today}`){
      autoRequested=`${pending}:${today}`;
      const note=document.querySelector('#ai-profile-note');
      note.textContent=pending==='diagnostic'?'Gemini seviye tespitini hazırlıyor…':'Gemini bugünün çalışma paketini yeniliyor…';
      desk.geminiKeyStatus().then(({configured})=>{
        if(page!=='ai')return;
        if(!configured){note.textContent='Gemini için İlerleme sayfasından API anahtarını ekle.';autoRequested='';return;}
        ask(pending,pending==='diagnostic'?'Başlangıç seviye tespitini hazırla.':'Bugünün tarihi '+today+'. Son cevaplarımı analiz ederek yeni günlük çalışma paketi oluştur.');
      }).catch(()=>{note.textContent='AI sunucusu şu anda kullanılamıyor. Bağlantıyı kontrol et.';autoRequested='';});
    }
  };
  const oldProgress = progress;
  progress = function () {
    oldProgress();
    const section = document.createElement('section');
    section.className = 'card';
    if (window.DEUTSCHAI_API_URL) {
      section.innerHTML = '<h2>Gemini bağlantısı</h2><p class="muted">Ortak Gemini API anahtarı yalnızca yetkili yöneticinin hesabından ayarlanır. Kullanıcılardan API anahtarı istenmez.</p><p class="muted" id="ai-cloud-status">Bağlantı durumu kontrol ediliyor…</p>';
      document.querySelector('#view').appendChild(section);
      desk.geminiKeyStatus().then(({configured}) => {
        section.querySelector('#ai-cloud-status').textContent = configured ? 'Gemini kullanıma hazır.' : 'Yönetici henüz Gemini bağlantısını yapılandırmadı.';
      }).catch(error => { section.querySelector('#ai-cloud-status').textContent = error.message; });
      return;
    }
    section.innerHTML = '<h2>Kendi Gemini API anahtarın</h2><p class="muted">AI özellikleri için kendi Gemini API anahtarını ekle. Anahtar bu Windows cihazında şifreli saklanır.</p><p id="ai-cloud-status" class="muted" role="status">Bağlantı durumu kontrol ediliyor…</p><form id="gemini-key-settings" class="settings-row" hidden><label>Yeni Gemini API anahtarı<input id="gemini-key-input" type="password" autocomplete="off" minlength="20"></label><button class="btn ghost" type="submit">Anahtarı kaydet</button><button class="btn ghost" id="gemini-key-remove" type="button">Bu cihazdan kaldır</button></form>';
    document.querySelector('#view').appendChild(section);
    const status = section.querySelector('#ai-cloud-status');
    const keyForm = section.querySelector('#gemini-key-settings');
    desk.geminiKeyStatus().then(({configured}) => {
      status.textContent = configured ? 'Gemini anahtarı bu cihazda kayıtlı.' : 'Henüz Gemini anahtarı eklenmemiş.';
      keyForm.hidden = false;
    }).catch(error => { status.textContent = error.message; });
    keyForm.onsubmit = async event => {
      event.preventDefault();
      const input = keyForm.querySelector('#gemini-key-input');
      try { await desk.geminiKeySave(input.value); input.value = ''; status.textContent = 'Gemini anahtarı bu cihazda kaydedildi.'; }
      catch (error) { status.textContent = error.message; }
    };
    keyForm.querySelector('#gemini-key-remove').onclick = async () => {
      try { await desk.geminiKeyRemove(); status.textContent = 'Gemini anahtarı bu cihazdan kaldırıldı.'; }
      catch (error) { status.textContent = error.message; }
    };
  };
  page = 'home';
  render = function () {
    applyTheme();
    if (page === 'welcome') welcomePage(); else if (page === 'home') home();
    else if (page === 'live') livePage();
    else if (page === 'placement') { if (liveActive || liveConnecting) liveRelease(); placementExamPage(); }
    else if (page === 'ai') { document.body.classList.remove('welcome-mode'); if (liveActive || liveConnecting) liveRelease(); teacherPage(); }
    else { document.body.classList.remove('welcome-mode'); if (liveActive || liveConnecting) liveRelease(); baseRender(); }
  };
  async function ensureDailyPlan(force = false) {
    if (!placement || !profile.onboardingComplete || (!force && dailyPack?.date === localDate() && dailyPack?.content?.source !== 'local-fallback')) return;
    const text='Bugünün tarihi '+localDate()+'. Öğrencinin seviye, günlük süre, son cevap ve yanlışlarına göre kişisel Goethe programını hazırla. Okuma, yazma, konuşma ve gramer görevleri koy; toplam süre hedefini aşma.';
    const answer=await requestDailyPlan(text);const schedule=Array.isArray(answer.schedule)?answer.schedule:[],target=Number(profile.dailyMinutes)||30,total=schedule.reduce((sum,item)=>sum+Math.max(0,Number(item.minutes)||0),0);
    if(total>target&&total>0){let used=0;schedule.forEach((item,index)=>{item.minutes=index===schedule.length-1?Math.max(0,target-used):Math.floor((Number(item.minutes)||0)*target/total);used+=item.minutes;});}
    dailyPack={date:localDate(),content:answer};window.deutschaiStore.setItem('deutschai-ai-daily-v1',JSON.stringify(dailyPack));livePlanSummary();
    history.push({task:'daily',at:new Date().toISOString(),level:profile.level,text,result:summarizeAnswer('daily',answer)});saveHistory();
  }
  window.deutschaiPrepareDailyPlan = async minutes => {
    const dailyMinutes = Math.max(5, Math.min(180, Number(minutes) || state.daily || 20));
    state.daily = dailyMinutes; save();
    profile = { ...profile, dailyMinutes };
    saveProfile();
    await ensureDailyPlan(true);
    if (page === 'home') home();
  };
  render();
})();
