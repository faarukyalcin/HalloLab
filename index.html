<script>
let DATA={"courses":[{"id":"a1","level":"A1","title":"A1 Temelleri","description":"Selamlaşma, tanışma, artikel, sein/haben ve Präsens.","position":1},{"id":"a2","level":"A2","title":"A2 Gelişim","description":"Perfekt, Dativ ve Nebensätze.","position":2}],"lessons":[{"id":"a1-begruessung","course_id":"a1","level":"A1","title":"Hallo und Begrüßung","intro_tr":"Almanca'da selamlaşma günün saatine ve resmiyet derecesine göre değişir.","points":["Hallo ve Hi gayriresmîdir; Guten Tag resmî ortamlarda kullanılır.","Sabah Guten Morgen, akşam Guten Abend denir.","Tschüs gayriresmî, Auf Wiedersehen resmî vedalaşmadır.","Wie geht's? 'Nasılsın?' demektir; kısa cevap: Danke, gut."],"examples":[{"de":"Guten Morgen, Frau Müller!","tr":"Günaydın Bayan Müller!"},{"de":"Wie geht es Ihnen? – Danke, gut.","tr":"Nasılsınız? – Teşekkürler, iyi."},{"de":"Tschüs, bis morgen!","tr":"Hoşça kal, yarın görüşürüz!"}],"position":1},{"id":"a1-vorstellen","course_id":"a1","level":"A1","title":"Sich vorstellen","intro_tr":"Kendini tanıtırken sabit kalıplar kullanılır.","points":["Ich heiße … veya Mein Name ist … ile isim söylenir.","Ich komme aus … ile ülke/şehir belirtilir.","Ich wohne in … yaşadığın yeri anlatır.","Ich bin … Jahre alt yaşı söyler."],"examples":[{"de":"Ich heiße Ali und ich komme aus der Türkei.","tr":"Adım Ali ve Türkiye'denim."},{"de":"Ich wohne in Istanbul.","tr":"İstanbul'da oturuyorum."},{"de":"Ich bin 25 Jahre alt.","tr":"25 yaşındayım."}],"position":2},{"id":"a1-artikel","course_id":"a1","level":"A1","title":"Artikel: der, die, das","intro_tr":"Her Almanca ismin bir cinsiyeti vardır ve artikel isimle birlikte öğrenilmelidir.","points":["der eril, die dişil, das nötr isimlerle kullanılır.","Çoğulda artikel her zaman die olur.","Belirsiz artikel: ein (der/das), eine (die).","Cinsiyet çoğu zaman mantıkla tahmin edilemez; kelimeyi artikeliyle ezberle."],"examples":[{"de":"der Tisch – die Lampe – das Buch","tr":"masa – lamba – kitap"},{"de":"Die Kinder spielen im Garten.","tr":"Çocuklar bahçede oynuyor."},{"de":"Das ist eine Lampe.","tr":"Bu bir lamba."}],"position":3},{"id":"a1-sein-haben","course_id":"a1","level":"A1","title":"Sein und haben","intro_tr":"İki en önemli yardımcı fiil: sein (olmak) ve haben (sahip olmak).","points":["sein: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie sind.","haben: ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie haben.","sein durum/meslek bildirir, haben sahip olmayı anlatır.","Olumsuzluk: sein ile nicht, haben + isim ile kein kullanılır."],"examples":[{"de":"Ich bin Student.","tr":"Ben öğrenciyim."},{"de":"Er hat einen Bruder.","tr":"Onun bir erkek kardeşi var."},{"de":"Wir sind müde.","tr":"Biz yorgunuz."}],"position":4},{"id":"a1-praesens","course_id":"a1","level":"A1","title":"Präsens: Regelmäßige Verben","intro_tr":"Düzenli fiiller kök + kişi eki ile çekimlenir.","points":["Ekler: -e, -st, -t, -en, -t, -en (ich, du, er, wir, ihr, sie).","wohnen → ich wohne, du wohnst, er wohnt.","Fiil, düz cümlede ikinci sırada durur.","Evet/hayır sorusunda fiil en başa gelir: Wohnst du hier?"],"examples":[{"de":"Ich lerne jeden Tag Deutsch.","tr":"Her gün Almanca öğreniyorum."},{"de":"Er wohnt in Berlin.","tr":"O Berlin'de oturuyor."},{"de":"Trinkst du Kaffee?","tr":"Kahve içiyor musun?"}],"position":5},{"id":"a1-zahlen-uhrzeit","course_id":"a1","level":"A1","title":"Zahlen und Uhrzeit","intro_tr":"Sayıları ve saati söylemek günlük hayatın temelidir.","points":["1 eins, 2 zwei, 3 drei, 4 vier, 5 fünf, 6 sechs, 7 sieben, 8 acht, 9 neun, 10 zehn.","Saat sorusu: Wie spät ist es? veya Wie viel Uhr ist es?","Es ist drei Uhr. = Saat üç.","halb vier = 3:30 (Almanca'da 'dörde yarım kala' denir)."],"examples":[{"de":"Es ist neun Uhr.","tr":"Saat dokuz."},{"de":"Es ist halb vier.","tr":"Saat üç buçuk."},{"de":"Ich habe zwei Brüder.","tr":"İki erkek kardeşim var."}],"position":6},{"id":"a2-perfekt","course_id":"a2","level":"A2","title":"Perfekt","intro_tr":"Geçmişi konuşma dilinde en sık Perfekt ile anlatırız.","points":["Perfekt = haben/sein (Präsens) + Partizip II.","Çoğu fiil haben ile; hareket ve durum değişikliği (gehen, fahren, bleiben) sein ile kurulur.","Düzenli fiil: ge-…-t (machen → gemacht).","Partizip II cümlenin sonuna gider."],"examples":[{"de":"Ich habe Deutsch gelernt.","tr":"Almanca öğrendim."},{"de":"Er ist nach Berlin gefahren.","tr":"O Berlin'e gitti (araçla)."},{"de":"Wir haben Pizza gegessen.","tr":"Pizza yedik."}],"position":7},{"id":"a2-dativ","course_id":"a2","level":"A2","title":"Dativ","intro_tr":"Dativ 'kime/neye' sorusunun cevabıdır ve bazı edatlarla zorunlu kullanılır.","points":["Dativ artikelleri: dem (der/das), der (die), den + -n (çoğul).","mit, bei, nach, von, zu, aus, seit her zaman Dativ ister.","helfen, danken, gehören gibi fiiller Dativ ile kullanılır.","zu + dem = zum, zu + der = zur."],"examples":[{"de":"Ich helfe dem Kind.","tr":"Çocuğa yardım ediyorum."},{"de":"Sie fährt mit dem Bus.","tr":"O otobüsle gidiyor."},{"de":"Wir gehen zur Ärztin.","tr":"Doktora (kadın) gidiyoruz."}],"position":8},{"id":"a2-weil","course_id":"a2","level":"A2","title":"Nebensätze mit weil und dass","intro_tr":"weil ve dass ile yan cümle kurulduğunda fiil cümlenin sonuna gider.","points":["weil = çünkü; fiil yan cümlenin sonuna gider.","dass = ki/-diğini; fiil yine sonda durur.","Ana cümle ile yan cümle virgülle ayrılır.","Ich bleibe zu Hause, weil ich krank bin."],"examples":[{"de":"Ich lerne Deutsch, weil ich in Deutschland arbeiten will.","tr":"Almanya'da çalışmak istediğim için Almanca öğreniyorum."},{"de":"Er sagt, dass er müde ist.","tr":"Yorgun olduğunu söylüyor."},{"de":"Sie lacht, weil der Film lustig ist.","tr":"Film komik olduğu için gülüyor."}],"position":9}],"vocabulary":[{"de":"Mutter","article":"die","plural":"Mütter","tr":"anne","example_de":"Meine Mutter kocht gern.","example_tr":"Annem yemek yapmayı sever.","level":"A1","category":"Familie"},{"de":"Vater","article":"der","plural":"Väter","tr":"baba","example_de":"Mein Vater arbeitet heute.","example_tr":"Babam bugün çalışıyor.","level":"A1","category":"Familie"},{"de":"Bruder","article":"der","plural":"Brüder","tr":"erkek kardeş","example_de":"Mein Bruder ist zwölf Jahre alt.","example_tr":"Erkek kardeşim on iki yaşında.","level":"A1","category":"Familie"},{"de":"Schwester","article":"die","plural":"Schwestern","tr":"kız kardeş","example_de":"Meine Schwester wohnt in Berlin.","example_tr":"Kız kardeşim Berlin'de oturuyor.","level":"A1","category":"Familie"},{"de":"Kind","article":"das","plural":"Kinder","tr":"çocuk","example_de":"Das Kind spielt im Garten.","example_tr":"Çocuk bahçede oynuyor.","level":"A1","category":"Familie"},{"de":"Freund","article":"der","plural":"Freunde","tr":"arkadaş","example_de":"Er ist mein bester Freund.","example_tr":"O benim en iyi arkadaşım.","level":"A1","category":"Familie"},{"de":"Brot","article":"das","plural":"Brote","tr":"ekmek","example_de":"Ich kaufe ein Brot.","example_tr":"Bir ekmek alıyorum.","level":"A1","category":"Essen und Trinken"},{"de":"Wasser","article":"das","plural":null,"tr":"su","example_de":"Ich trinke Wasser.","example_tr":"Su içiyorum.","level":"A1","category":"Essen und Trinken"},{"de":"Apfel","article":"der","plural":"Äpfel","tr":"elma","example_de":"Der Apfel ist rot.","example_tr":"Elma kırmızı.","level":"A1","category":"Essen und Trinken"},{"de":"Kaffee","article":"der","plural":null,"tr":"kahve","example_de":"Ich möchte einen Kaffee.","example_tr":"Bir kahve istiyorum.","level":"A1","category":"Essen und Trinken"},{"de":"Käse","article":"der","plural":null,"tr":"peynir","example_de":"Der Käse schmeckt gut.","example_tr":"Peynir lezzetli.","level":"A1","category":"Essen und Trinken"},{"de":"Milch","article":"die","plural":null,"tr":"süt","example_de":"Die Milch ist kalt.","example_tr":"Süt soğuk.","level":"A1","category":"Essen und Trinken"},{"de":"Frühstück","article":"das","plural":null,"tr":"kahvaltı","example_de":"Das Frühstück ist um acht Uhr.","example_tr":"Kahvaltı saat se n einen Termin.","example_tr":"Yarın bir randevum var.","level":"A2","category":"Gesundheit"},{"de":"die Apotheke","article":"die","plural":"Apotheken","tr":"eczane","example_de":"Die Apotheke ist noch geöffnet.","example_tr":"Eczane hâlâ açık.","level":"A1","category":"Gesundheit"},{"de":"sich treffen","article":null,"plural":null,"tr":"buluşmak","example_de":"Wir treffen uns um sechs.","example_tr":"Saat altıda buluşuyoruz.","level":"A2","category":"Freizeit"},{"de":"der Schmerz","article":"der","plural":"Schmerzen","tr":"ağrı","example_de":"Ich habe Kopfschmerzen.","example_tr":"Başım ağrıyor.","level":"A2","category":"Gesundheit"},{"de":"anrufen","article":null,"plural":null,"tr":"telefon etmek","example_de":"Kannst du mich heute anrufen?","example_tr":"Beni bugün arayabilir misin?","level":"A1","category":"Kommunikation"},{"de":"umsteigen","article":null,"plural":null,"tr":"aktarma yapmak","example_de":"In Hamburg müssen wir umsteigen.","example_tr":"Hamburg'da aktarma yapmamız gerekiyor.","level":"A2","category":"Reisen"}],"grammar":[{"id":"g-artikel","level":"A1","title":"Artikel","explanation_tr":"Almanca'da isimlerin üç cinsiyeti vardır: der (eril), die (dişil), das (nötr). Çoğulda hepsi die olur. Artikeli ismin parçası gibi ezberle.","comparisons":[{"wrong":"Das Tisch ist braun.","right":"Der Tisch ist braun.","why":"Tisch erildir."}],"position":1},{"id":"g-sein-haben","level":"A1","title":"Sein und haben","explanation_tr":"sein 'olmak', haben 'sahip olmak' demektir. İkisi de düzensiz çekimlenir ve Perfekt'te yardımcı fiil olarak kullanılır.","comparisons":[{"wrong":"Ich habe müde.","right":"Ich bin müde.","why":"Yorgunluk durumu sein ile söylenir."}],"position":2},{"id":"g-praesens","level":"A1","title":"Präsens","explanation_tr":"Düzenli fiiller kök + -e, -st, -t, -en, -t, -en ile çekimlenir. Ayrılabilen fiillerde ön ek cümle sonuna gider.","comparisons":[{"wrong":"Ich gehen Schule.","right":"Ich gehe zur Schule.","why":"ich ile fiil -e alır ve 'okula' için zur kullanılır."}],"position":3},{"id":"g-perfekt","level":"A2","title":"Perfekt","explanation_tr":"Perfekt = haben/sein + Partizip II. Hareket ve durum değişikliği bildiren fiiller sein alır.","comparisons":[{"wrong":"Ich habe nach Berlin gefahren.","right":"Ich bin nach Berlin gefahren.","why":"fahren hareket fiili olduğu için sein alır."}],"position":4},{"id":"g-dativ","level":"A2","title":"Dativ","explanation_tr":"Dativ kime/neye sorusunu cevaplar. mit, bei, nach, von, zu, aus, seit edatlarından sonra ve helfen, danken, gehören fiilleriyle kullanılır.","comparisons":[{"wrong":"Ich helfe das Kind.","right":"Ich helfe dem Kind.","why":"helfen Dativ ister."}],"position":5},{"id":"g-nebensatz","level":"A2","title":"Nebensätze","explanation_tr":"weil, dass, wenn gibi bağlaçlardan sonra çekimli fiil cümlenin sonuna gider.","comparisons":[{"wrong":"Ich bleibe, weil ich bin krank.","right":"Ich bleibe, weil ich krank bin.","why":"weil cümlesinde fiil sondadır."}],"position":6},{"id":"offline-akkusativ","level":"A1","title":"Akkusativ: nesne hâli","explanation_tr":"Belirli bir doğrudan nesne Akkusativ olur. Eril artikel der → den, belirsiz ein → einen biçimine dönüşür. Dişil ve nötr artikeller değişmez.","comparisons":[{"de":"Ich sehe den Mann.","tr":"Adamı görüyorum."},{"de":"Sie kauft eine Tasche.","tr":"Bir çanta alıyor."}],"position":20},{"id":"offline-modal","level":"A1","title":"Modal fiiller: können, müssen, wollen","explanation_tr":"Modal fiil çekimlenir, asıl fiil mastar hâlinde cümlenin sonuna gider. können yetenek, müssen zorunluluk, wollen istek bildirir.","comparisons":[{"de":"Ich kann gut schwimmen.","tr":"İyi yüzebilirim."},{"de":"Wir müssen heute lernen.","tr":"Bugün ders çalışmalıyız."}],"position":21},{"id":"offline-perfekt","level":"A2","title":"Perfekt: geçmiş zaman","explanation_tr":"Günlük konuşmada geçmişi anlatırken çoğunlukla Perfekt kullanılır. haben/sein çekimi ikinci sırada, Partizip II cümlenin sonunda yer alır.","comparisons":[{"de":"Ich habe gestern gearbeitet.","tr":"Dün çalıştım."},{"de":"Er ist nach Hause gegangen.","tr":"Eve gitti."}],"position":22},{"id":"offline-dativ","level":"A2","title":"Dativ: dolaylı nesne","explanation_tr":"Dativ kişi veya nesneye yönelme bildirir. Dativ alan edatlar arasında mit, bei, von, zu ve aus bulunur. Eril/nötr dem, dişil der olur.","comparisons":[{"de":"Ich fahre mit dem Bus.","tr":"Otobüsle gidiyorum."},{"de":"Sie hilft ihrer Mutter.","tr":"Annesine yardım ediyor."}],"position":23},{"id":"offline-nebensatz","level":"A2","title":"weil ve dass ile yan cümle","explanation_tr":"weil (çünkü) ve dass (…diğini) ile kurulan yan cümlede çekimli fiil sona gider.","comparisons":[{"de":"Ich bleibe zu Hause, weil ich krank bin.","tr":"Hastayım, bu yüzden evde kalıyorum."},{"de":"Ich weiß, dass er heute kommt.","tr":"Onun bugün geleceğini biliyorum."}],"position":24},{"id":"offline-trennbar","level":"A1","title":"Ayrılabilen fiiller","explanation_tr":"anrufen, einkaufen ve aufstehen gibi ayrılabilen fiillerde önek ana cümlede sona gider. Mastar biçiminde fiil birleşik kalır.","comparisons":[{"de":"Ich stehe um sieben Uhr auf.","tr":"Saat yedide kalkıyorum."},{"de":"Er ruft seine Mutter an.","tr":"Annesini arıyor."}],"position":25},{"id":"offline-komparativ","level":"A2","title":"Karşılaştırma: Komparativ","explanation_tr":"Karşılaştırmada sıfata çoğunlukla -er eklenir ve als kullanılır. Eşitlik karşılaştırması so … wie kalıbıyla yapılır.","comparisons":[{"de":"Berlin ist größer als Bonn.","tr":"Berlin Bonn'dan daha büyük."},{"de":"Er ist so alt wie ich.","tr":"O benim kadar yaşlı."}],"position":26}],"exercises":[{"id":"a1-begruessung-q1","skill":"grammatik","level":"A1","prompt":"Du triffst deinen Lehrer um 9 Uhr morgens. Was sagst du?","options":["Guten Morgen","Gute Nacht","Tschüs","Guten Abend"],"answer":"Guten Morgen","explanation":"Sabah saatlerinde Guten Morgen denir.","lesson_id":"a1-begruessung"},{"id":"a1-begruessung-q2","skill":"grammatik","level":"A1","prompt":"Welche Verabschiedung ist formell?","options":["Tschüs","Auf Wiedersehen","Hi","Hallo"],"answer":"Auf Wiedersehen","explanation":"Auf Wiedersehen resmî vedalaşmadır.","lesson_id":"a1-begruessung"},{"id":"a1-begruessung-q3","skill":"grammatik","level":"A1","prompt":"Auf „Wie geht's?“ antwortest du:","options":["Danke, gut.","Ich heiße Anna.","Auf Wiedersehen.","Ich bin 20."],"answer":"Danke, gut.","explanation":"Wie geht's? sorusuna durum bildiren kısa cevap verilir.","lesson_id":"a1-begruessung"},{"id":"a1-vorstellen-q1","skill":"grammatik","level":"A1","prompt":"Ich ___ Ali.","options":["heiße","heißt","heißen","heißst"],"answer":"heiße","explanation":"ich ile fiil heiße şeklinde çekimlenir.","lesson_id":"a1-vorstellen"},{"id":"a1-vorstellen-q2","skill":"grammatik","level":"A1","prompt":"Woher kommst du?","options":["Ich komme aus Izmir.","Ich wohne gern.","Ich bin gut.","Ich heiße komme."],"answer":"Ich komme aus Izmir.","explanation":"Woher? sorusu geldiğin yeri sorar.","lesson_id":"a1-vorstellen"},{"id":"a1-vorstellen-q3","skill":"grammatik","level":"A1","prompt":"Ich ___ 25 Jahre alt.","options":["bin","habe","heiße","komme"],"answer":"bin","explanation":"Almanca'da yaş sein fiiliyle söylenir: Ich bin … Jahre alt.","lesson_id":"a1-vorstellen"},{"id":"a1-artikel-q1","skill":"grammatik","level":"A1","prompt":"___ Buch ist neu.","options":["Das","Der","Die","Den"],"answer":"Das","explanation":"Buch nötr bir isimdir: das Buch.","lesson_id":"a1-artikel"},{"id":"a1-artikel-q2","skill":"grammatik","level":"A1","prompt":"___ Lampe ist hell.","options":["Die","Der","Das","Ein"],"answer":"Die","explanation":"Lampe dişildir: die Lampe.","lesson_id":"a1-artikel"},{"id":"a1-artikel-q3","skill":"grammatik","level":"A1","prompt":"Im Plural benutzt man immer: ___ Kinder.","options":["Die","Der","Das","Ein"],"answer":"Die","explanation":"Çoğulda artikel hep die'dir.","lesson_id":"a1-artikel"},{"id":"a1-sein-haben-q1","skill":"grammatik","level":"A1","prompt":"Du ___ sehr nett."   const saved = localStorage.getItem(oldKey);
  if (saved !== null && localStorage.getItem(KEY_PREFIX) === null) localStorage.setItem(KEY_PREFIX, saved);
  for (const key of Object.keys(localStorage)) {
    const suffix = ':' + legacyProfile;
    if (!key.startsWith('deutschai-ai-') || !key.endsWith(suffix)) continue;
    const localKey = key.slice(0, -suffix.length);
    if (localStorage.getItem(localKey) === null) localStorage.setItem(localKey, localStorage.getItem(key));
  }
  localStorage.removeItem('deutschai-user-id');
  sessionStorage.removeItem('deutschai-active-account');
}

function dateStr(){return new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}
function shell(title,body,eyebrow='HALLOLAB'){renderNav();applyTheme();document.querySelector('#view').innerHTML=`<header class="top"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div class="settings-row"><div class="date">${dateStr()}</div></div></header>${body}`}
function baseTheme(name=state.theme){return name==='dark'?'light':name.replace(/-dark$/,'')}
function isDarkTheme(name=state.theme){return name==='dark'||name.endsWith('-dark')}
function setTheme(name){if(!['light','dark','ocean','ocean-dark','violet','violet-dark','rose','rose-dark','sunset','sunset-dark'].includes(name))return;const dark=isDarkTheme();state.theme=dark?(name==='light'?'dark':name+'-dark'):name;save();render()}
function applyTheme(){const names=['dark','ocean','ocean-dark','violet','violet-dark','rose','rose-dark','sunset','sunset-dark'];document.body.classList.remove(...names.map(x=>'theme-'+x));if(state.theme!=='light')document.body.classList.add('theme-'+state.theme)}
function toggleTheme(){state.theme=isDarkTheme()?baseTheme():(state.theme==='light'?'dark':state.theme+'-dark');save();render()}
function planSteps(){const d=Number(state.daily)||20;return d<=10?['3 dk kelime tekrarı','4 dk ders','3 dk alıştırma']:d<=20?['5 dk kelime tekrarı','10 dk ders','5 dk alıştırma']:['7 dk kelime tekrarı','15 dk ders','8 dk alıştırma']}
function dailyWords(){const due=DATA.vocabulary.map((w,i)=>({w,i})).filter(x=>!state.learned[x.i]||Date.now()-state.learned[x.i]>86400000);return (due.length?due:DATA.vocabulary.map((w,i)=>({w,i}))).slice(0,3)}
function reviewBox(label='Günün kelime tekrarı'){const ws=dailyWords();return `<section class="card"><div class="section-title"><div><h2>${label}</h2><small class="muted">Ders başında ve sonunda kısa tekrar.</small></div><button class="btn ghost" onclick="setPage('words')">Tüm kelimeler →</button></div><div class="tiles">${ws.map(x=>`<button class="tile" onclick="this.querySelector('small').textContent='${escapeHtml(x.w.tr)}'+' · '+('${escapeHtml(x.w.example_de||'')}')"><span>${escapeHtml(x.w.article||'Aa')}</span><b>${escapeHtml(x.w.de)}</b><small>${escapeHtml(x.w.category||'')}</small></button>`).join('')}</div></section>`}
function beginStudy(){state.minutes+=5;save()}
function home(){
  const due=DATA.vocabulary.filter((_,i)=>!state.learned[i]||Date.now()-state.learned[i]>86400000).length;
  const pct=Math.min(100,Math.round(state.minutes/state.daily*100));

  const steps=planSteps();
    shell('Öğrenme paneli',`<div class="dashboard">
    <section class="dash-hero"><div class="dash-hero-copy"><div class="eyebrow">HALLOLAB · ALMANCA ÖĞREN</div><h2>${escapeHtml(window.deutschaiStudentName || 'Guten Tag')} 👋<br><span>Bugünkü hedefin hazır.</span></h2><p>${state.level} seviyesinde, günlük ${state.daily} dakikalık Almanca çalışman. Kelime, gramer, dinleme ve konuşma becerilerini adım adım geliştir.</p><div class="dash-workflow">${steps.map((step,i)=>`<div class="dash-step"><i>${['01','02','03'][i]}</i><span>${escapeHtml(step)}</span></div>`).join('<b class="dash-step-link">→</b>')}</div><div class="dash-actions"><button class="btn" onclick="setPage('lessons')">Derse devam et <span>↗</span></button><button class="btn ghost" onclick="setPage(&quot;live&quot;)">🎙 Bugünkü programı asistanla konuş</button></div></div><div class="dash-ring-wrap"><div class="dash-ring" style="--goal-fill:${pct}%"><div><strong>${pct}%</strong><small>GÜNLÜK HEDEF</small></div></div><span class="dash-ring-caption">${state.minutes} / ${state.daily} dakika</span><span class="dash-ring-glow"></span></div></section>
    <section class="dash-metrics"><article class="dash-metric metric-cyan"><span class="dash-metric-icon">◷</span><small>ÇALIŞMA SÜRESİ</small><b data-count="${state.minutes}">${state.minutes}<em> dk</em></b><span>Bugünkü toplam</span></article><article class="dash-metric metric-violet"><span class="dash-metric-icon">▤</span><small>TAMAMLANAN DERS</small><b data-count="${state.completed.length}">${state.completed.length}<em> / ${DATA.lessons.length}</em></b><span>Öğrenme kütüphanesi</span></article><article class="dash-metric metric-green"><span class="dash-metric-icon">Aa</span><small>KELİME HAZİNESİ</small><b data-count="${Object.keys(state.learned).length}">${Object.keys(state.learned).length}<em> kelime</em></b><span>${due} kelime tekrar bekliyor</span></article><article class="dash-metric metric-pink"><span class="dash-metric-icon">✦</span><small>ÖĞRENME SEVİYESİ</small><b>${state.level}</b><span>CEFR · Almanca seviyesi</span></article></section>
    <section class="dash-section-head"><div><span class="eyebrow">BUGÜNÜN AKIŞI</span><h2>Çalışma alanın</h2></div><button class="dash-text-link" onclick="setPage('progress')">İlerlemeyi görüntüle&nbsp; →</button></section>
    <div class="dash-content-grid"><article class="dash-panel dash-route"><div class="dash-panel-heading"><div><span class="dash-icon-badge cyan">⌁</span><h3>Günün öğrenme rotası</h3><p>Ayırdığın süreye göre düzenlendi</p></div><span class="dash-live-pill"><i></i> BUGÜN</span></div><div class="dash-route-list">${steps.map((step,i)=>`<div class="dash-route-step"><span class="dash-route-num">0${i+1}</span><div><b>${escapeHtml(step)}</b><small>${['Kelime hazineni tazele','Yeni bir konuyu öğren','Bilgini kısa alıştırmayla pekiştir'][i]}</small></div><span class="dash-route-arrow">${i===0?'◉':i===1?'◇':'✓'}</span></div>`).join('')}</div><button class="dash-panel-link" onclick="setPage('lessons')">Çalışmaya başla <span>→</span></button></article>
    <article class="dash-panel dash-focus"><div class="dash-panel-heading"><div><span class="dash-icon-badge violet">≋</span><h3>Günün gramer konusu</h3></div><span class="badge">${escapeHtml(grammar?.level||state.level)}</span></div><div class="dash-focus-topic">${escapeHtml(grammar?.title||'Gramer tekrarı')}</div><p>${escapeHtml(grammar?.explanation_tr||'Bugün gramer konularını tekrar et.')}</p><div class="dash-focus-bottom"><div class="dash-mini-progress"><i style="width:${pct}%"></i></div><small>${pct}% günlük hedef</small></div><button class="dash-panel-link" onclick="setPage('grammar')">Konuyu aç <span>→</span></button></article></div>
    <div class="dash-content-grid dash-lower-grid"><article class="dash-panel dash-lessons"><div class="dash-panel-heading"><div><span class="dash-icon-badge green">▤</span><h3>Öğrenmeye devam et</h3><p>${state.level} seviyene uygun dersler</p></div><button class="dash-text-link" onclick="setPage('lessons')">Tüm dersler →</button></div><div class="dash-lesson-list">${nextLessons.map((l,i)=>`<button class="dash-lesson-row" onclick="openLesson('${l.id}')"><span class="dash-lesson-count">0${i+1}</span><span class="dash-lesson-copy"><b>${escapeHtml(l.title)}</b><small>${escapeHtml(l.intro_tr||'')}</small></span><span class="badge">${escapeHtml(l.level)}</span><span class="dash-lesson-arrow">↗</span></button>`).join('')||'<p class="muted">Bu seviyede ders yok. Kişisel programın ve günlük çalışmaların burada.</p>'}</div></article><article class="dash-panel dash-review"><div class="dash-panel-heading"><div><span class="dash-icon-badge pink">Aa</span><h3>Kelime tekrarı</h3><p>Hatırlamanı güçlendir</p></div><span class="dash-review-count">${due}<small> tekrar</small></span></div><div class="dash-review-words">${dailyWords().slice(0,3).map((x,i)=>`<button class="dash-word" onclick="setPage('words')"><span class="dash-word-index">0${i+1}</span><span><b>${escapeHtml(x.w.de)}</b><small>${escapeHtml(x.w.category||'Günün kelimesi')}</small></span><span>→</span></button>`).join('')}</div><button class="dash-panel-link" onclick="setPage('words')">Kelime kartlarına geç <span>→</span></button></article></div>
  </div>`);
  animateDashboardCounters();
}
function animateDashboardCounters(){const counters=[...document.querySelectorAll('.dash-metric [data-count]')];const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;if(reduced){for(const el of counters)el.firstChild.textContent=el.dataset.count;return}for(const el of counters){const target=Number(el.dataset.count)||0,node=el.firstChild,start=performance.now(),duration=1150;const tick=now=>{const p=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-p,3);node.textContent=String(Math.round(target*eased));if(p<1)requestAnimationFrame(tick)};node.textContent='0';requestAnimationFrame(tick)}}
function lessons(){let items=DATA.lessons.filter(l=>(filter==='Tümü'||l.level===filter)&&l.level===state.level);shell('Dersler',`<div class="section-title"><div><h2>${state.level} öğrenme yolu</h2><small class="muted">Seviyene göre sıralanmış dersler; seviye ayarlardan değiştirilebilir.</small></div></div><div class="filter">${['Tümü','A1','A2'].map(f=>`<button class="${filter===f?'active':''}" onclick="filter='${f}';lessons()">${f}</button>`).join('')}</div><div class="list">${items.map(l=>`<button class="row" onclick="openLesson('${l.id}')"><span class="badge">${l.level}</span><span class="grow"><b>${escapeHtml(l.title)}</b><small>${escapeHtml(l.intro_tr||'')}</small></span><span>${state.completed.includes(l.id)?'✓':'→'}</span></button>`).join('')||'<div class="empty">Bu seviyede ders yok. İlerleme bölümünden seviyeni değiştirebilirsin.</div>'}</div>`)}
function openLesson(id){const l=DATA.lessons.find(x=>x.id===id);if(!l)return;page='lesson';renderNav();const examples=(l.examples||[]).map(e=>`<div class="example"><b>${escapeHtml(e.de)}</b><span>${escapeHtml(e.tr)}</span></div>`).join('');document.querySelector('#view').innerHTML=`<header class="top"><div><div class="eyebrow">${l.level} · DERS</div><h1>${escapeHtml(l.title)}</h1></div><button class="btn ghost" onclick="setPage('lessons')">← Derslere dön</button></header>${reviewBox('Ders başı · kelime ısınması')}<article class="card lesson"><h3>Konu özeti</h3><p>${escapeHtml(l.intro_tr||'')}</p><ul>${(l.points||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul><h3>Örnekler</h3>${examples}<button class="btn" onclick="completeLesson('${id}')">Dersi tamamla&nbsp; ✓</button></article>`}
function completeLesson(id){if(!state.completed.includes(id))state.completed.push(id);beginStudy();save();const l=DATA.lessons.find(x=>x.id===id);if(l){state.grammarDone[l.id]=new Date().toISOString().slice(0,10);save()}page='lesson-end';renderNav();document.querySelector('#view').innerHTML=`<header class="top"><div><div class="eyebrow">DERS TAMAMLANDI</div><h1>Sehr gut! ✓</h1></div><button class="btn ghost" onclick="setPage('lessons')">Derslere dön</button></header>${reviewBox('Ders sonu · kelime pekiştirme')}<section class="card"><h2>Bir sonraki adım</h2><p class="muted">${l?.title?escapeHtml(l.title)+' tamamlandı.':'Ders tamamlandı.'} Şimdi yeni kelimeleri gözden geçir veya birkaç alıştırma çöz.</p><button class="btn" onclick="setPage('practice')">Alıştırmaya geç →</button></section>`}
function words(){if(!DATA.vocabulary.length){shell('Kelime kartları','<div class="empty">Kelime içeriği bulunamadı.</div>');return}const cats=['Tümü',...new Set(DATA.vocabulary.map(w=>w.category).filter(Boolean))];let indexes=DATA.vocabulary.map((w,i)=>i).filter(i=>wordFilter==='Tümü'||DATA.vocabulary[i].category===wordFilter);if(!indexes.length)indexes=DATA.vocabulary.map((_,i)=>i);if(state.wrongWords.length&&wordFilter==='Yanlışlar')indexes=[...new Set(state.wrongWords)];wordIndex=indexes[wordIndex%indexes.length];const w=DATA.vocabulary[wordIndex];const selected=wordMode==='quiz'?quizOptions(wordIndex):null;shell('Kelime kartları',`<div class="section-title"><div><h2>Hatırlama pratiği</h2><small class="muted">${wordIndex+1} / ${DATA.vocabulary.length} · ${state.wrongWords.length} yanlış cevap tekrar sırasına eklendi</small></div><span class="badge">${w.level} · ${escapeHtml(w.category||'')}</span></div><div class="filter">${cats.map(c=>`<button class="${wordFilter===c?'active':''}" onclick="wordFilter='${c}';wordIndex=0;words()">${escapeHtml(c)}</button>`).join('')}<button class="${wordFilter==='Yanlışlar'?'active':''}" onclick="wordFilter='Yanlışlar';wordIndex=0;words()">Yanlışlar (${state.wrongWords.length})</button><button class="${wordMode==='quiz'?'active':''}" onclick="wordMode=wordMode==='quiz'?'kart':'quiz';words()">${wordMode==='quiz'?'Kart moduna dön':'Test modu'}</button></div><div class="card">${wordMode==='quiz'?`<div class="question"><b>${escapeHtml(w.tr)} için Almanca karşılığı seç:</b>${selected.map(o=>`<button class="option" onclick="wordAnswer(${wordIndex},this,'${escapeHtml(o).replace(/'/g,'&#39;')}')">${escapeHtml(o)}</button>`).join('')}<div class="feedback" id="word-feedback"></div></div>`:`<div class="flash" onclick="wordBack=!wordBack;words()"><div><div class="de">${escapeHtml(wordBack?`${w.article||''} ${w.de}`:w.tr)}</div>${wordBack?`<div class="tr">${escapeHtml(w.tr)}</div>`:`<div class="hint">Türkçeyi gördün · cevabı açmak için dokun</div>`}<div class="hint" style="margin-top:12px">${wordBack?escapeHtml((w.example_de||'')+' · '+(w.example_tr||'')):'Kartı çevirmek için tıkla'}</div></div></div><div class="flash-controls"><button class="btn ghost" onclick="wordIndex=(wordIndex+indexes.length-1)%indexes.length;wordBack=false;words()">← Önceki</button><button class="btn" onclick="markWord(${wordIndex})">Biliyorum ✓</button><button class="btn ghost" onclick="wordIndex=(wordIndex+1)%indexes.length;wordBack=false;words()">Sonraki →</button></div>`}</div><div class="muted" style="text-align:center">Kelime hazinesi: ${Object.keys(state.learned).length} / ${DATA.vocabulary.length} · Öğrendiklerin bu cihazda saklanır.</div>`)}
function quizOptions(i){const answer=DATA.vocabulary[i].de;const others=DATA.vocabulary.filter((_,j)=>j!==i).sort(()=>Math.random()-.5).slice(0,3).map(w=>`${w.article||''} ${w.de}`.trim());return [...others,`${DATA.vocabulary[i].article||''} ${answer}`.trim()].sort(()=>Math.random()-.5)}
function wordAnswer(i,el,value){const correct=`${DATA.vocabulary[i].article||''} ${DATA.vocabulary[i].de}`.trim();const ok=value===correct;el.classList.add(ok?'correct':'wrong');if(!ok){if(!state.wrongWords.includes(i))state.wrongWords.push(i);document.querySelector('#word-feedback').textContent=`Tekrar sırasına eklendi. Doğru cevap: ${correct}`;[...el.parentElement.querySelectorAll('.option')].find(x=>x.textContent===correct)?.classList.add('correct')}else{state.learned[i]=Date.now();state.wrongWords=state.wrongWords.filter(x=>x!==i);document.querySelector('#word-feedback').textContent='Doğru! Kelime hazinene eklendi.'}state.attempts.push({ok,word:true,at:Date.now()});save()}
function markWord(i){state.learned[i]=Date.now();state.wrongWords=state.wrongWords.filter(x=>x!==i);save();wordIndex=(wordIndex+1)%DATA.vocabulary.length;wordBack=false;beginStudy();words()}
function grammar(){shell('Gramer',`<div class="section-title"><div><h2>Konular</h2><small class="muted">Türkçe açıklamalar, örnekler ve kısa kurallar.</small></div></div><div class="list">${DATA.grammar.map(g=>`<details class="card"><summary><span class="badge">${g.level}</span> <b style="margin-left:10px">${escapeHtml(g.title)}</b></summary><p>${escapeHtml(g.explanation_tr)}</p>${(g.comparisons||[]).map(x=>`<div class="example"><b>${escapeHtml(x.de||x.title||'')}</b><span>${escapeHtml(x.tr||x.text||'')}</span></div>`).join('')}</details>`).join('')||'<div class="empty">Gramer konu özeti dersler bölümünde yer alıyor.</div>'}</div>`)}
function practice(){const qs=DATA.exercises.filter(q=>q.skill==='lesen'||q.skill==='horen'||q.skill==='grammatik'||q.skill==='wortschatz');shell('Alıştırmalar',`<div class="section-title"><div><h2>Soru bankası</h2><small class="muted">${qs.length} özgün alıştırma · anında cevap kontrolü</small></div></div><div class="filter">${['Tümü','A1','A2'].map(f=>`<button class="${filter===f?'active':''}" onclick="filter='${f}';practice()">${f}</button>`).join('')}</div><div id="questions">${qs.filter(q=>filter==='Tümü'||q.level===filter).slice(0,24).map(questionHTML).join('')}</div>`)}
function questionHTML(q,i){const opts=Array.isArray(q.options)?q.options:[];return `<article class="question" id="q-${i}">${q.passage?`<p class="muted">${escapeHtml(q.passage)}</p>`:''}<b>${escapeHtml(q.prompt)}</b><div>${opts.map(o=>`<button class="option" onclick="answer('${q.id}',this,'${escapeHtml(String(o)).replace(/'/g,'&#39;')}','${escapeHtml(String(q.answer)).replace(/'/g,'&#39;')}','${escapeHtml(q.explanation||'').replace(/'/g,'&#39;')}')">${escapeHtml(o)}</button>`).join('')}</div><div class="feedback" id="f-${i}"></div></article>`}
function answer(id,el,val,correct,explain){const box=el.closest('.question');if(box.dataset.done)return;box.dataset.done='1';const ok=val===correct;el.classList.add(ok?'correct':'wrong');if(!ok)[...box.querySelectorAll('.option')].find(x=>x.textContent===correct)?.classList.add('correct');document.getElementById('f-'+box.id.slice(2)).textContent=(ok?'Doğru! ':'Tekrar dene: ')+explain;state.attempts.push({ok,at:Date.now()});save();beginStudy()}
function exam(){const qs=[...DATA.exercises].sort(()=>Math.random()-.5).slice(0,10);shell('Deneme sınavı',`<div class="card"><h2>10 soruluk mini deneme</h2><p class="muted">Her soruda cevabını seç. Sonuçlar yalnızca bu cihazda saklanır.</p><button class="btn" onclick="runExam()">Sınavı başlat&nbsp; →</button></div><div id="examqs"></div>`)}
function runExam(){const qs=[...DATA.exercises].sort(()=>Math.random()-.5).slice(0,10);document.querySelector('#examqs').innerHTML=qs.map(questionHTML).join('')+`<button class="btn" onclick="finishExam()">Sonucu gör</button><div id="result" class="card"></div>`;window.examCount=qs.length;window.scrollTo(0,document.body.scrollHeight)}
function finishExam(){const q=document.querySelectorAll('#examqs .question');const done=[...q].filter(x=>x.dataset.done).length;const correct=[...q].filter(x=>x.querySelector('.correct')&&x.dataset.done).length;const result=document.querySelector('#result');result.innerHTML=`<h2>Sonuç: ${correct} / ${q.length}</h2><p class="muted">${done<q.length?`${q.length-done} soruyu boş bıraktın. `:''}${Math.round(correct/q.length*100)}% başarı</p>`;state.attempts.push({exam:true,correct,total:q.length,at:Date.now()});beginStudy();save()}

  function placementLocalPackage(){const allowed=placementAllowedLevels(),pool=Array.isArray(DATA.exercises)?DATA.exercises:[],past=new Set(history.slice(-12).flatMap(x=>x.questions||[]).map(x=>String(x).trim().toLocaleLowerCase('de'))),pick=(skill)=>{let rows=pool.filter(q=>allowed.includes(q.level)&&q.skill===skill&&Array.isArray(q.options)&&q.options.length>=2),fresh=rows.filter(q=>!past.has(String(q.prompt||q.question||'').trim().toLocaleLowerCase('de')));return (fresh.length?fresh:rows).sort(()=>Math.random()-.5)},toQuestion=(q,i)=>({id:q.id||String(i),level:q.level,question:q.prompt||q.question||'',options:q.options||[],answer:Number.isInteger(q.answer)?q.answer:Math.max(0,(q.options||[]).indexOf(q.answer)),explanation:q.explanation||'',skill:q.skill||''});const listening=pick('horen').map((q,i)=>({...toQuestion(q,i),audioText:q.audio_text||''}));const reads=[];for(const q of pick('lesen')){const answer=Number.isInteger(q.answer)?q.answer:(q.options||[]).indexOf(q.answer);const correct=(q.options||[])[answer];const other=(q.options||[]).find((_,i)=>i!==answer);if(q.passage&&correct)reads.push({id:'read-'+q.id+'-t',level:q.level,passage:q.passage,statement:(q.prompt||'')+' '+correct,options:['Richtig','Falsch'],answer:0,skill:'Lesen'});if(q.passage&&other)reads.push({id:'read-'+q.id+'-f',level:q.level,passage:q.passage,statement:(q.prompt||'')+' '+other,options:['Richtig','Falsch'],answer:1,skill:'Lesen'});}const grammar=pick('grammatik').map(toQuestion),vocabulary=pick('wortschatz').map(toQuestion);return {source:'local-fallback',notice:'Gemini erişilemedi. Bu oturumda uygulamanın yerel A1–A2 soru havuzu kullanılıyor; bu yüzden B1–C2 hakkında yeterli veri oluşmazsa sonuç güveni düşük gösterilecek.',title:'Kapsamlı Almanca seviye tespit sınavı',levels:allowed,speakingPrompt:'Stelle dich vor. Erzähle über deinen Alltag, deine Erfahrungen und deine Meinung. Ich stelle dir passende Fragen.',writingTasks:placementLevelOrder.map((level,i)=>({level,prompt:['Stelle di adımın bugün.</h2></div></div><div class="app-steps"><article><i>01</i><b>Seviyeni seç</b><p>A1 veya A2 derslerinden sana uygun olanı aç.</p></article><article><i>02</i><b>Kısa bir pratik yap</b><p>Kelime, gramer veya konuşma çalışması seç.</p></article><article><i>03</i><b>Her gün biraz ilerle</b><p>İlerlemeni gör, Almanca öğrenme hedefini adım adım yaklaştır.</p></article></div></section><section class="app-roadmap"><div><span class="eyebrow">ÖĞRENME YOLUN</span><h2>A1’den A2’ye,<br>Almanca öğrenme hedefine.</h2></div><div class="app-roadmap-line"><span><i>✓</i><b>A1</b><small>Temeller</small></span><em></em><span><i>2</i><b>A2</b><small>Günlük Almanca</small></span><em></em><span><i>✦</i><b>GOETHE</b><small>Sınav hazırlığı</small></span></div></section><section class="app-faq"><span class="eyebrow">MERAK ETTİKLERİN</span><h2>Başlamadan önce</h2><details><summary>Uygulama ücretsiz mi?</summary><p>Evet. Hazır dersler ve alıştırmalar ücretsiz. Gemini Live için internet, API anahtarı ve mikrofon izni gerekir.</p></details><details><summary>Hangi seviyeler var?</summary><p>Uygulamada A1–A2 dersleri ve Goethe sınav formatında çalışmalar bulunur.</p></details><details><summary>Sesli öğretmen beni nasıl düzeltir?</summary><p>Senaryonu seçip konuşmaya başla. Gemini Live yanıt verir ve konuşma transkriptini gösterir.</p></details></section><section class="app-final-cta"><span class="eyebrow">HAZIRSAN BAŞLAYALIM</span><h2>İlk Almanca cümleni bugün kur.</h2><p>Bir senaryo seç, Gemini Live ile konuşma pratiğine başla.</p><button class="btn" onclick="document.querySelector(&quot;#ai-live-trigger&quot;).click()">Gemini Live ile başla <b>→</b></button></section><footer class="welcome-footer">DEUTSCHAI <span>·</span> KÜÇÜK ADIMLAR, GÜÇLÜ BİR ALMANCA</footer></main>`;
    livePaint();liveStatus(liveActive?'Dinliyorum… konuşabilirsin':'GEMINI LIVE · HAZIR',liveActive);
    document.querySelector('#ai-live-start').onclick=()=>liveActive?liveRelease():liveStart();
    document.querySelector('#ai-live-trigger').onclick=()=>liveActive?liveRelease():liveStart();
  }
  const baseTeacherPage = teacherPage;
  teacherPage = function () {
    document.body.classList.remove('welcome-mode');
    baseTeacherPage();
    if (dailyPack?.date === localDate()) document.querySelector('#ai-result').innerHTML = renderDaily(dailyPack.content);
    const today=localDate(), pending=!placement?'diagnostic':dailyPack?.date!==today?'daily':null;
    if(pending && autoRequested!==`${pending}:${today}`){
      autoRequested=`${pending}:${today}`;
      const note=document.querySelector('#ai-profile-note');
      note.textContent=pending==='diagnostic'?'Gemini seviye tespitini hazırlıyor…':'Gemini bugünün çalışma paketini yeniliyor…';
      desk.geminiKeyStatus().then(({configured})=>{
        if(page!=='ai')return;
        if(!configured){note.textContent='Gemini için İlerleme sayfasından API anahtarını ekle.';autoRequested='';return;}
        ask(pending,pending==='diagnostic'?'Başlangıç seviye tespitini hazırla.':'Bugünün tarihi '+today+'. Son cevaplarımı analiz ederek yeni günlük çalışma paketi oluştur.');
      }).catch(()=>{note.textContent='AI sunucusu şu anda kullanılamıyor. Bağlantıyı kontrol et.';autoRequested='';});
    }
  };
  const oldProgress = progress;
  progress = function () {
    oldProgress();
    const section = document.createElement('section');
    section.className = 'card';
    section.innerHTML = '<h2>Kendi Gemini API anahtarın</h2><p class="muted">AI özellikleri için kendi Gemini API anahtarını ekle. Anahtar bu sekmenin belleğinde tutulur ve Gemini isteklerinde Google’a gönderilir.</p><p id="ai-cloud-status" class="muted" role="status">Bağlantı durumu kontrol ediliyor…</p><form id="gemini-key-settings" class="settings-row" hidden><label>Yeni Gemini API anahtarı<input id="gemini-key-input" type="password" required autocomplete="off" minlength="20"></label><button class="btn ghost" type="submit">Anahtarı kaydet</button><button class="btn ghost" id="gemini-key-remove" type="button">Bu oturumdan kaldır</button></form>';
    document.querySelector('#view').appendChild(section);
    const status = section.querySelector('#ai-cloud-status');
    const keyForm = section.querySelector('#gemini-key-settings');
    desk.geminiKeyStatus().then(({configured}) => {
      status.textContent = configured ? 'Gemini anahtarı bu oturumda hazır.' : 'Henüz Gemini anahtarı eklenmemiş.';
      keyForm.hidden = false;
    }).catch(error => { status.textContent = error.message; });
    keyForm.onsubmit = async event => {
      event.preventDefault();
      const input = keyForm.querySelector('#gemini-key-input');
      try { await desk.geminiKeySave(input.value); input.value = ''; status.textContent = 'Gemini anahtarı bu oturum için eklendi.'; }
      catch (error) { status.textContent = error.message; }
    };
    keyForm.querySelector('#gemini-key-remove').onclick = async () => {
      try { await desk.geminiKeyRemove(); status.textContent = 'Gemini anahtarı bu oturumdan kaldırıldı.'; }
      catch (error) { status.textContent = error.message; }
    };
  };
  page = 'home';
  render = function () {
    applyTheme();
    if (page === 'welcome') welcomePage(); else if (page === 'home') home();
    else if (page === 'live') livePage();
    else if (page === 'placement') { if (liveActive || liveConnecting) liveRelease(); placementExamPage(); }
    else if (page === 'ai') { document.body.classList.remove('welcome-mode'); if (liveActive || liveConnecting) liveRelease(); teacherPage(); }
    else { document.body.classList.remove('welcome-mode'); if (liveActive || liveConnecting) liveRelease(); baseRender(); }
  };
  async function ensureDailyPlan(force = false) {
    if (!placement || !profile.onboardingComplete || (!force && dailyPack?.date === localDate() && dailyPack?.content?.source !== 'local-fallback')) return;
    const text='Bugünün tarihi '+localDate()+'. Öğrencinin seviye, günlük süre, son cevap ve yanlışlarına göre kişisel Almanca çalışma programını hazırla. Okuma, yazma, konuşma ve gramer görevleri koy; toplam süre hedefini aşma.';
    const answer=await requestDailyPlan(text);const schedule=Array.isArray(answer.schedule)?answer.schedule:[],target=Number(profile.dailyMinutes)||30,total=schedule.reduce((sum,item)=>sum+Math.max(0,Number(item.minutes)||0),0);
    if(total>target&&total>0){let used=0;schedule.forEach((item,index)=>{item.minutes=index===schedule.length-1?Math.max(0,target-used):Math.floor((Number(item.minutes)||0)*target/total);used+=item.minutes;});}
    dailyPack={date:localDate(),content:answer};localStorage.setItem('deutschai-ai-daily-v1',JSON.stringify(dailyPack));livePlanSummary();
    history.push({task:'daily',at:new Date().toISOString(),level:profile.level,text,result:summarizeAnswer('daily',answer)});saveHistory();
  }
  window.deutschaiPrepareDailyPlan = async minutes => {
    const dailyMinutes = Math.max(5, Math.min(180, Number(minutes) || state.daily || 20));
    state.daily = dailyMinutes; save();
    profile = { ...profile, dailyMinutes };
    saveProfile();
    await ensureDailyPlan(true);
    if (page === 'home') home();
  };
  render();
})();
